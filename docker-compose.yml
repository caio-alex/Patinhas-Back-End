services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patinhas
      POSTGRES_PASSWORD: patinhas
      POSTGRES_DB: patinhas_store
    ports:
      - "5433:5432"
    volumes:
      - patinhas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patinhas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://patinhas:patinhas@db:5432/patinhas_store"
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  patinhas_db_data: